<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glasses — 液态玻璃桌面</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05060a;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #gpu-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #boot-error {
        display: none;
        position: absolute;
        inset: 0;
        padding: 48px;
        color: #f4f4f5;
        background: radial-gradient(circle at top, #1a1f35, #05060a 60%);
      }
      #boot-error h1 {
        margin: 0 0 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      #boot-error p {
        max-width: 52ch;
        line-height: 1.6;
        color: #a1a1aa;
      }
      #boot-error code {
        color: #e4e4e7;
        background: rgba(255, 255, 255, 0.06);
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }
      #hud {
        position: absolute;
        left: 16px;
        bottom: 16px;
        pointer-events: none;
        color: rgba(255, 255, 255, 0.55);
        font-size: 12px;
        letter-spacing: 0.04em;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gpu-canvas"></canvas>
      <div id="boot-error">
        <h1>无法启动 Glasses</h1>
        <p id="boot-error-msg"></p>
      </div>
      <div id="hud">GLASSES · 液态玻璃桌面 · 双击桌面打开启动器</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
